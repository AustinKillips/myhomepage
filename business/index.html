<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Employee Onboarding — CX4E</title>
  <meta name="description" content="Cyclocross for Everyone new employee onboarding.">
  <link rel="stylesheet" href="/business/styles.css">
</head>
<body>
  <main class="site-shell">
    <div class="wallpaper" aria-hidden="true"></div>
    <section class="video-stage" aria-label="CX4E Corporate Onboarding video">
      <h1 class="homepage-title">New Employee Onboarding</h1>
      <div class="video-frame">
        <iframe
          id="onboarding-video"
          src="https://player.vimeo.com/video/1248749314?autopause=0&amp;player_id=onboarding-video&amp;app_id=58479&amp;title=0&amp;byline=0&amp;portrait=0&amp;badge=0"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          title="CX4E Corporate Onboarding"
          allowfullscreen></iframe>
        <button class="custom-play" id="customPlay" type="button" aria-label="Play onboarding video"><img src="/business/assets/vmp.png" alt="" aria-hidden="true"></button>
      </div>
      <nav class="margin-links" aria-label="External links">
        <a href="https://runsignup.com/Race/IL/Chicago/CrossIs4Everyone?ref=cx4everyone.com" target="_blank" rel="noreferrer">Register Here</a>
        <a href="https://www.cx4everyone.com/" target="_blank" rel="noreferrer">CX4E.com</a>
      </nav>
      <nav class="menu-buttons" aria-label="Onboarding resources">
        <a href="/business/resource/?page=financial-prospectus">Financial Prospectus</a>
        <a href="/business/resource/?page=work-life-balance">Work Life Balance</a>
        <a href="/business/resource/?page=quarterly-goals">Quarterly Goals</a>
        <a href="/business/resource/?page=daily-motivation">Daily Motivation</a>
        <a href="/business/resource/?page=litigation-outcome">Litigation Outcome</a>
        <a href="/business/resource/?page=credits">Credits</a>
      </nav>
    </section>
  </main>
  <script>
    document.getElementById('customPlay').addEventListener('click', function () {
      document.getElementById('onboarding-video').contentWindow.postMessage({ method: 'play' }, 'https://player.vimeo.com');
      this.hidden = true;
    });
  </script>
</body>
</html>
